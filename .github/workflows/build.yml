name: Build Veyra

# Laeuft automatisch bei jedem Push auf "main" und laesst sich
# zusaetzlich manuell ueber den "Actions"-Tab auf GitHub starten.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Native WebView2- und Aufnahmeschutz-Tests brauchen Windows.
    runs-on: windows-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: .NET 8 SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Self-contained Single-File EXE erstellen (win-x64)
        run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish

      - name: Sitzungs- und Prozessfehler-Regressionstests
        run: dotnet run --project tests/windows-logic/WindowsLogic.Tests.csproj -c Release

      - name: EXE optional mit Windows-Zertifikat signieren
        if: ${{ vars.ENABLE_CODE_SIGNING == 'true' }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            throw "Code-Signing ist aktiviert, aber Zertifikat oder Passwort fehlen."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "Veyra-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) {
            throw "signtool.exe wurde im Windows SDK nicht gefunden."
          }
          & $signtool.FullName sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "${{ github.workspace }}\publish\Veyra.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Das Signieren der EXE ist fehlgeschlagen."
          }
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Portables ZIP mit enthaltener WebView2-Laufzeit erstellen
        shell: pwsh
        run: ./scripts/build-portable.ps1 -SkipPublish

      - name: Windows Smoke-Test (Schutz und WebView2-Initialisierung)
        shell: pwsh
        run: |
          $results = Join-Path $env:GITHUB_WORKSPACE "test-results"
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          $smokeLog = Join-Path $results "smoke-test.log"
          "Veyra Windows Smoke-Test" | Set-Content -Path $smokeLog
          "Start: $(Get-Date -Format o)" | Add-Content -Path $smokeLog
          $process = Start-Process -FilePath "${{ github.workspace }}\publish\Veyra.exe" -ArgumentList "--smoke-test" -PassThru
          "PID: $($process.Id)" | Add-Content -Path $smokeLog
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            "FEHLER: Smoke-Test hat nach 30 Sekunden nicht beendet." | Add-Content -Path $smokeLog
            throw "Smoke-Test hat nach 30 Sekunden nicht beendet."
          }
          "Ende: $(Get-Date -Format o)" | Add-Content -Path $smokeLog
          "Exit-Code: $($process.ExitCode)" | Add-Content -Path $smokeLog
          if ($process.ExitCode -ne 0) {
            throw "Smoke-Test fehlgeschlagen (Exit-Code $($process.ExitCode))."
          }

      - name: Windows UI-Diagnose und Screenshot
        if: always()
        shell: pwsh
        run: |
          $results = Join-Path $env:GITHUB_WORKSPACE "test-results"
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          $diagnosticLog = Join-Path $results "ui-diagnostic.log"
          "Veyra Windows UI-Diagnose" | Set-Content -Path $diagnosticLog
          "Start: $(Get-Date -Format o)" | Add-Content -Path $diagnosticLog
          $process = $null

          try {
            $process = Start-Process -FilePath "${{ github.workspace }}\publish\Veyra.exe" -PassThru
            "PID: $($process.Id)" | Add-Content -Path $diagnosticLog
            "Warte 12 Sekunden auf Fenster- und WebView2-Initialisierung." | Add-Content -Path $diagnosticLog
            Start-Sleep -Seconds 12
            $process.Refresh()

            if ($process.HasExited) {
              "FEHLER: Prozess wurde unerwartet beendet. Exit-Code: $($process.ExitCode)" | Add-Content -Path $diagnosticLog
              throw "Die App wurde waehrend der UI-Diagnose unerwartet beendet."
            }

            "Prozess laeuft nach der Initialisierungsphase." | Add-Content -Path $diagnosticLog
            Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public static class SecureWindowAppDiagnostics
          {
              [StructLayout(LayoutKind.Sequential)]
              public struct RECT
              {
                  public int Left;
                  public int Top;
                  public int Right;
                  public int Bottom;
              }

              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);

              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hWnd);

              [DllImport("user32.dll")]
              public static extern bool ShowWindow(IntPtr hWnd, int command);
          }
          "@
            $null = $process.WaitForInputIdle(10000)
            $process.Refresh()
            $windowHandle = $process.MainWindowHandle
            "Fenster-Handle: $windowHandle" | Add-Content -Path $diagnosticLog
            if ($windowHandle -eq [IntPtr]::Zero) {
              throw "Kein Hauptfenster-Handle der App gefunden."
            }

            [SecureWindowAppDiagnostics]::ShowWindow($windowHandle, 5) | Out-Null
            [SecureWindowAppDiagnostics]::SetForegroundWindow($windowHandle) | Out-Null
            Start-Sleep -Seconds 2

            $windowRect = New-Object SecureWindowAppDiagnostics+RECT
            if (-not [SecureWindowAppDiagnostics]::GetWindowRect($windowHandle, [ref]$windowRect)) {
              throw "Die Fensterkoordinaten konnten nicht gelesen werden."
            }

            $windowWidth = $windowRect.Right - $windowRect.Left
            $windowHeight = $windowRect.Bottom - $windowRect.Top
            if ($windowWidth -le 0 -or $windowHeight -le 0) {
              throw "Das App-Fenster hat ungueltige Abmessungen ($windowWidth x $windowHeight)."
            }

            Add-Type -AssemblyName System.Drawing
            $bitmap = New-Object System.Drawing.Bitmap($windowWidth, $windowHeight)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($windowRect.Left, $windowRect.Top, 0, 0, $bitmap.Size)
              $screenshot = Join-Path $results "ui-diagnostic.png"
              $bitmap.Save($screenshot, [System.Drawing.Imaging.ImageFormat]::Png)
              "App-Screenshot gespeichert: $screenshot ($($windowWidth)x$($windowHeight))" | Add-Content -Path $diagnosticLog
            }
            finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          }
          catch {
            "DIAGNOSE-HINWEIS/FEHLER: $($_.Exception.Message)" | Add-Content -Path $diagnosticLog
            Write-Warning $_.Exception.Message
          }
          finally {
            if ($null -ne $process) {
              $process.Refresh()
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
                "Prozess nach Diagnose beendet." | Add-Content -Path $diagnosticLog
              }
            }
            "Ende: $(Get-Date -Format o)" | Add-Content -Path $diagnosticLog
          }

      - name: Windows-Testprotokolle und Screenshot hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Veyra-windows-test-results
          path: test-results
          if-no-files-found: warn

      - name: Portables ZIP als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Veyra-win-x64-portable
          path: |
            Veyra-*-win-x64-portable.zip
            Veyra-*-win-x64-portable.zip.sha256

  deploy-website:
    name: Website auf workers.dev veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: veyra-website-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Cloudflare-Zugang prüfen
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Das Repository-Secret CLOUDFLARE_API_TOKEN fehlt. Siehe cloudflare/README.md."
            exit 1
          fi

      - name: Veröffentlichungstools installieren
        run: npm ci --no-audit --no-fund

      - name: Geprüftes Windows-Paket laden
        uses: actions/download-artifact@v4
        with:
          name: Veyra-win-x64-portable
          path: .

      - name: Website und Download veröffentlichen
        run: npm run site:deploy
